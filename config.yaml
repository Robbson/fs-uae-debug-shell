# yaml-language-server: $schema=./config.schema.json
#
# Watchpoint scenarios for the Debug Shell.
#
# `defaults` are applied to every entry unless the entry overrides `length` or
# `flags`.  A scenario is activated with `:sci add <name>` (or `:sci add *`),
# which assigns the watchpoint numbers automatically and remembers the aliases;
# `:sci rm <name>` (or `:sci rm *`) removes it again.  Aliases replace the
# numbers in the condensed output, the CSV log and the status line.
#
# The same `defaults` back the quick address shorthand, which needs no scenario:
#   :574, 576 4, 580
# adds those addresses as watchpoints (aliased by the address, with an optional
# per-address length override).
#
# Quote addresses: an unquoted `0574` would be read as a YAML integer.
memwatch:
  defaults:
    length: 4
    flags: [W, C, L]
  scenarios:
    ball:
      - name: ball.x
        address: "11BDE"
      - name: ball.y
        address: "11BE2"
      - name: ball.vx
        address: "11BE6"
      - name: ball.vy
        address: "11BEA"

