[project]
name = "fs-uae-debug-shell"
version = "0.1.0"
description = "Pseudo terminal around fs-uae for easier debugging and watch memory logging"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pexpect>=4.9.0",
    "prompt-toolkit>=3.0.53",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fs_uae_debug_shell"]

